name: evidence-fact-research

on:
  workflow_run:
    workflows: [evidence-review-queue]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate the split pipeline from a stalled legacy all-in-one runner.
  # Both generations reject a push if main moved since their checkout.
  group: evidence-review-queue-v2
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record the source revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the public inventory
        run: |
          python3 -m pip install -r requirements.txt
          GITHUB_SHA="$(git rev-parse HEAD)" python3 build.py
      - name: Discover public candidates and check dated sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_sources.py
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          from handbook_builder.maintenance import GitHubReader, discover, json_write, utc_today
          config=json.loads(Path('data/maintenance-config.json').read_text())
          projects=json.loads(Path('data/emerging-watch.json').read_text())['projects']
          existing={r['repository'] for r in config['repositories']}
          config['repositories'] += [{'repository':p['repository'],'paths':['README.md']}
              for p in projects[:3] if p['repository'] not in existing]
          records,observations=discover(config,GitHubReader(os.environ['GITHUB_TOKEN']),utc_today())
          json_write(Path('.local/autonomy/discovery.json'),{'records':records,'observations':observations})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: handbook-inventory-${{ github.run_id }}
          path: |
            site/assets/reference-data.json
            .local/autonomy/discovery.json
            .local/source-review.json
          include-hidden-files: true
          retention-days: 2

  prepare:
    needs: inventory
    runs-on: [self-hosted, prismo]
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inventory.outputs.base_sha }}
          fetch-depth: 0
      - name: Record the source revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require the self-hosted research pool
        run: test "${RUNNER_ENVIRONMENT:-}" = "self-hosted"
      - name: Install research dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: handbook-inventory-${{ github.run_id }}
          path: .
      - name: Verify the inventory source revision
        run: |
          .venv/bin/python - <<'PY'
          import json, subprocess
          from pathlib import Path
          inventory=json.loads(Path('site/assets/reference-data.json').read_text())
          expected=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if inventory.get('commit')!=expected:
              raise ValueError('Public inventory does not match the checked-out source revision')
          PY
      - name: Verify deployment before using its private ledger
        run: |
          # Pages completion and custom-domain propagation can exceed 3 minutes.
          for attempt in $(seq 1 24); do
            if .venv/bin/python scripts/check_deployment.py https://uas-handbook.com --expected-commit "$(git rev-parse HEAD)" --require-storage --require-attachments; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Apply independently verified facts and prepare bounded research
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTONOMY_DISPATCH_URL: ${{ secrets.AUTONOMY_DISPATCH_URL }}
          AUTONOMY_REVIEW_TOKEN: ${{ secrets.AUTONOMY_REVIEW_TOKEN }}
        run: .venv/bin/python scripts/maintain_handbook.py --apply | tee .local/maintenance-summary.json
      - name: Start the next bounded independent evidence batch
        id: research
        # Provider outages or exhausted credits must not block public metadata.
        # Source retrieval, validation and publication remain required steps.
        continue-on-error: true
        env:
          AUTONOMY_DISPATCH_URL: ${{ secrets.AUTONOMY_DISPATCH_URL }}
          AUTONOMY_REVIEW_TOKEN: ${{ secrets.AUTONOMY_REVIEW_TOKEN }}
        run: |
          .venv/bin/python scripts/run_autonomous_evidence.py --input .local/autonomy/maintenance-queue.json --provider auto --maximum 2 --start-limit 4 --request-limit 4 --model gpt-5.5
      - name: Package public candidate files
        run: .venv/bin/python scripts/package_maintenance.py --output .local/maintenance-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: handbook-candidate-${{ github.run_id }}
          path: .local/maintenance-candidate/
          include-hidden-files: true
          retention-days: 2
      - name: Summarize maintenance
        if: always()
        env:
          RESEARCH_STEP_OUTCOME: ${{ steps.research.outcome }}
        run: |
          .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          from pathlib import Path
          for name in ['maintenance-summary.json','autonomy/publication-summary.json','autonomy/plan.json']:
              path=Path('.local')/name
              if path.exists():
                  data=json.loads(path.read_text())
                  print('### '+name+'\n')
                  print('```json\n'+json.dumps(data.get('summary',data),indent=2)+'\n```\n')
          outcome=os.environ.get('RESEARCH_STEP_OUTCOME','unknown')
          print('### Optional paid research step: '+outcome+'\n')
          if outcome=='failure':
              print('Paid research did not complete. Public metadata can still be validated and published; this is not successful factual verification. Inspect the research step before retrying any uncertain dispatch.\n')
              print('::warning::Optional paid research failed; public metadata upkeep continues.',file=sys.stderr)
          Path('.local/research-step-status.json').write_text(json.dumps({'outcome':outcome})+'\n')
          print('Progress comes from the private durable ledger; deployment changes do not reset paid research. Metadata checks continue after the non-renewing trial stops.')
          PY
      - name: Preserve source fingerprints
        if: always() && hashFiles('.local/source-review.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .local/source-review.json
          key: evidence-source-state-${{ github.run_id }}
      - name: Save public maintenance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handbook-maintenance-${{ github.run_id }}
          path: |
            .local/maintenance-summary.json
            .local/research-step-status.json
            .local/autonomy/publication-summary.json
            .local/browser-check/results.json
            data/update-status.json
            data/emerging-watch.json
          if-no-files-found: warn
          retention-days: 30

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: handbook-candidate-${{ github.run_id }}
          path: .
      - name: Install public build dependencies
        run: |
          python3 -m pip install -r requirements.txt
          npm ci
      - name: Validate the proposed public revision
        run: |
          python3 -m compileall -q build.py handbook_builder scripts tests
          python3 -m unittest discover -s tests
          npm test
          for file in assets/*.js server/*.mjs functions/api/*.js; do node --check "$file"; done
          python3 scripts/check_links.py
          python3 scripts/check_integration_replay.py
          python3 build.py
          python3 scripts/reconcile_tables.py
          python3 scripts/check_generated_site.py site/index.html
          python3 scripts/check_evidence.py
          python3 scripts/build_review_queue.py
          npm run build:functions
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Package the validated public revision
        run: python3 scripts/package_maintenance.py --output .local/maintenance-validated --include-tables
      - uses: actions/upload-artifact@v4
        with:
          name: handbook-validated-${{ github.run_id }}
          path: .local/maintenance-validated/
          include-hidden-files: true
          retention-days: 2

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: handbook-validated-${{ github.run_id }}
          path: .
      - name: Publish the validated public changes
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths=json.loads(Path('.local/autonomy/changed-files.json').read_text())+['data/table-dispositions.json']
          allowed={'data/evidence.json','data/table-dispositions.json','data/update-status.json','data/emerging-watch.json'}
          roots={'fundamentals','firmware','field','integration','components','platforms','autonomy','appendices'}
          for value in paths:
              path=Path(value)
              assert not path.is_absolute() and '..' not in path.parts
              assert value in allowed or (path.parts[0] in roots and path.suffix=='.md')
          subprocess.run(['git','add','--',*sorted(set(paths))],check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "handbook-maintenance[bot]"
          git config user.email "handbook-maintenance[bot]@users.noreply.github.com"
          git commit -m "Maintain dated release watchlists and independently verified facts"
          # A concurrent main change aborts this push; never force or overwrite it.
          git push origin HEAD:main
      - name: Verify the published revision
        run: |
          # Keep the exact-commit gate while allowing custom-domain propagation.
          for attempt in $(seq 1 24); do
            if python3 scripts/check_deployment.py https://uas-handbook.com --expected-commit "$(git rev-parse HEAD)" --require-storage --require-attachments; then exit 0; fi
            sleep 15
          done
          exit 1
